<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>랜덤 숫자 생성기</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="badge">Random Generator</div>
      <h1>🎲 랜덤 숫자 생성기</h1>
      <p class="subtitle">원하는 범위를 설정하고 행운의 숫자를 뽑아보세요!</p>
    </header>

    <main class="card">
      <!-- 숫자 표시 화면 -->
      <div class="display-section">
        <div class="number-display" id="numberDisplay">?</div>
        <div class="quick-actions">
          <button id="copyBtn" class="btn-subtle" title="복사하기" style="display: none;">
            📋 복사하기
          </button>
        </div>
      </div>

      <!-- 범위 설정 영역 -->
      <div class="controls">
        <div class="input-group">
          <label for="minInput">최솟값</label>
          <input type="number" id="minInput" value="1" step="1">
        </div>
        <span class="range-separator">~</span>
        <div class="input-group">
          <label for="maxInput">최댓값</label>
          <input type="number" id="maxInput" value="100" step="1">
        </div>
      </div>

      <!-- 빠른 프리셋 버튼 -->
      <div class="presets">
        <button class="preset-btn" data-min="1" data-max="6">주사위 (1~6)</button>
        <button class="preset-btn" data-min="1" data-max="45">로또 (1~45)</button>
        <button class="preset-btn" data-min="1" data-max="100">1 ~ 100</button>
        <button class="preset-btn" data-min="1" data-max="1000">1 ~ 1000</button>
      </div>

      <!-- 생성 버튼 -->
      <button id="generateBtn" class="btn-primary">
        <span>숫자 생성하기</span>
      </button>

      <!-- 생성 기록 -->
      <section class="history-section">
        <div class="history-header">
          <h3>최근 생성 기록</h3>
          <button id="clearHistoryBtn" class="btn-text">기록 지우기</button>
        </div>
        <div id="historyList" class="history-list">
          <p class="empty-history">아직 생성된 숫자가 없습니다.</p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>Made with ❤️ by <a href="https://github.com/tiifosia/teat" target="_blank">tiifosia/teat</a></p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
